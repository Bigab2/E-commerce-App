workflows:
  ios-simulator:
    name: iOS Simulator Build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Build for simulator
        script: flutter build ios --simulator --debug
      - name: Find duplicate files
        script: |
          cd build/ios/iphonesimulator
          find Runner.app -name "9n.9.png"
      - name: Remove duplicate file names and zip
        script: |
          cd build/ios/iphonesimulator
          find Runner.app -type f -not -name "Info.plist" -printf '%f\n' | sort | uniq -d > dups.txt
          echo "Duplicated names:"
          cat dups.txt
          while read name; do
            find Runner.app -type f -name "$name" | tail -n +2 | while read f; do
              case "$f" in
                *.png|*.jpg|*.jpeg) rm -f "$f" ;;
              esac
            done
          done < dups.txt
          zip -r -X -y Runner_appetize.zip Runner.app
    artifacts:
      - build/ios/iphonesimulator/Runner_appetize.zip